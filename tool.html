<script>

const API="https://ai-caption-server-3rxf.onrender.com"

/* ===== UPGRADE ===== */
function upgrade(){
window.open(
"https://ai-creator-studio.lemonsqueezy.com/checkout/buy/eba7f826-a7ae-4527-a2d7-3fb7e6237384",
"_blank"
)
}

/* ===== PLAN CHECK ===== */
async function loadUserPlan(email){

const normalizedEmail = email.trim().toLowerCase()

console.log("LOGIN EMAIL:", normalizedEmail)

const { data } = await supabaseClient
.from("users")
.select("plan,email")

console.log("DB DATA:", data)

const match = data.find(
u => u.email?.toLowerCase().trim() === normalizedEmail
)

currentPlan = match?.plan || "free"

console.log("PLAN:", currentPlan)

if(currentPlan === "pro"){
unlockProUI()
}

}
/* ===== UNLOCK ===== */
function unlockProUI(){
document.querySelectorAll(".proFeature").forEach(el=>{
el.classList.remove("lock")
el.innerHTML = el.innerHTML.replace("🔒","")
})
document.getElementById("upgradeBox").style.display="none"
}

/* ===== FREE LIMIT ===== */
function canUseFree(){
if(currentPlan === "pro") return true

const today = new Date().toISOString().slice(0,10)
const lastUse = localStorage.getItem("freeUseDate")

if(lastUse === today) return false

localStorage.setItem("freeUseDate", today)
return true
}

/* ===== IMAGE PREVIEW ===== */
document.getElementById("image").addEventListener("change",function(){
const file=this.files[0]
if(!file) return

const reader=new FileReader()
reader.onload=e=>{
document.getElementById("preview").src=e.target.result
}
reader.readAsDataURL(file)
})

/* ===== LOGIN ===== */
async function loginWithGoogle(){
await supabaseClient.auth.signInWithOAuth({
provider:'google',
options:{
redirectTo: "https://ai-creator-studio-seven.vercel.app/tool.html"
}
})
}

/* ===== GENERATE ===== */
async function generateCaption(){

const { data: { session } } = await supabaseClient.auth.getSession()

if(!session){
alert("Please login first")
return
}

if(!canUseFree()){
document.getElementById("upgradeBox").style.display="block"
return
}

const file=document.getElementById("image").files[0]
if(!file){
alert("Upload image")
return
}

const reader=new FileReader()

document.getElementById("loading").innerText="Generating..."

reader.onload=async function(e){

const res=await fetch(API+"/caption",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
image:e.target.result,
style:document.getElementById("style").value
})
})

const data=await res.json()

document.getElementById("loading").innerText=""

document.getElementById("captionResult").innerHTML = `
<div class="card">
<h3>Optimized Caption</h3>
<p id="mainCaption">${data.optimized_caption}</p>

<button onclick="copyCaption()">Copy</button>

<h3>Hooks</h3>
<ul>${data.hooks.map(h=>`<li>${h}</li>`).join("")}</ul>

<h3>Hashtags</h3>
<p>${data.hashtags.join(" ")}</p>
</div>
`
}

reader.readAsDataURL(file)
}

/* ===== COPY ===== */
function copyCaption(){
const text=document.getElementById("mainCaption").innerText
navigator.clipboard.writeText(text)
alert("Copied")
}

/* ===== INIT ===== */
window.onload = async function(){

const { data: { session } } = await supabaseClient.auth.getSession()

if(session){
document.getElementById("loginBlock").style.display="none"
document.getElementById("toolBlock").style.display="block"

await loadUserPlan(session.user.email)
}

}
</script>
