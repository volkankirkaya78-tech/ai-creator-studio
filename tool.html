<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>AI Creator Studio</title>

<style>

body{
font-family:Arial;
background:#f4f6fb;
text-align:center;
padding:60px;
}

.box{
background:white;
padding:40px;
border-radius:12px;
max-width:700px;
margin:auto;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

button{
background:#4f46e5;
color:white;
border:none;
padding:14px 28px;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:20px;
}

.result{
margin-top:30px;
font-size:18px;
line-height:1.6;
}

.upgrade{
margin-top:40px;
display:none;
background:#fafafa;
padding:20px;
border-radius:8px;
}

.feedback{
margin-top:50px;
text-align:left;
}

textarea{
width:100%;
height:120px;
padding:10px;
border-radius:6px;
border:1px solid #ddd;
}

</style>

</head>

<body>

<div class="box">

<h1>AI Caption Generator</h1>

<p>Upload a photo and generate viral captions instantly.</p>

<input type="file" id="imageUpload">

<br>

<button onclick="generateCaption()">Generate Caption</button>

<div class="result" id="result"></div>

<div class="upgrade" id="upgrade">

<h3>Your free caption is ready 🎉</h3>

<p>Upgrade to Pro to unlock:</p>

<ul style="text-align:left">
<li>Unlimited captions</li>
<li>Trend Detector</li>
<li>Viral Ideas</li>
<li>Content Calendar</li>
<li>Reel Generator</li>
<li>Competitor Analyzer</li>
</ul>

<a href="https://ai-creator-studio.lemonsqueezy.com/checkout/buy/eba7f826-a7ae-4527-a2d7-3fb7e6237384">
<button>Upgrade to Pro – $12/month</button>
</a>

</div>

<div class="feedback">

<hr>

<h3>Send Feedback</h3>

<p>Help us improve the tool.</p>

<textarea id="feedbackText" placeholder="Write your feedback here"></textarea>

<br>

<button onclick="sendFeedback()">Send Feedback</button>

<p id="feedbackMessage"></p>

</div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

/* =========================
SUPABASE INIT
========================= */

const supabase = window.supabase.createClient(
  "https://zfqgqpactijrdwvuocga.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmcWdxcGFjdGlqcmR3dnVvY2dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MTY3MTIsImV4cCI6MjA4OTA5MjcxMn0.M1wmpW6SBjWbJ2B3Rg5kCkA4jeKtlmx3S_-AI-b5ybA"
)

let currentPlan = "free"

/* =========================
CHECK USER PLAN
========================= */

async function checkUserPlan() {
  const { data: { user } } = await supabase.auth.getUser()

  if (!user) return

  const { data } = await supabase
    .from("users")
    .select("plan")
    .eq("email", user.email)
    .single()

  currentPlan = data?.plan || "free"

  console.log("PLAN:", currentPlan)
}

/* =========================
API
========================= */

const API_URL = "https://ai-caption-server-3rxf.onrender.com/caption"

const today = new Date().toISOString().slice(0,10)

let usage = JSON.parse(localStorage.getItem("usage")) || {
date:today,
count:0
}

if(usage.date !== today){
usage.date = today
usage.count = 0
localStorage.setItem("usage", JSON.stringify(usage))
}

/* =========================
GENERATE CAPTION
========================= */

async function generateCaption(){

// 🔥 PRO ise limitsiz
if(currentPlan !== "pro" && usage.count >= 1){

document.getElementById("upgrade").style.display="block"

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
})

return

}

const file = document.getElementById("imageUpload").files[0]

if(!file){
alert("Upload image first")
return
}

const reader = new FileReader()

reader.onloadend = async function(){

const image = reader.result

document.getElementById("result").innerHTML = "Generating caption..."

const response = await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
image:image,
style:"viral"
})
})

const data = await response.json()

document.getElementById("result").innerHTML =
"<b>Optimized Caption</b><br><br>" + data.optimized_caption

// 🔥 sadece free user sayılır
if(currentPlan !== "pro"){
usage.count++
localStorage.setItem("usage", JSON.stringify(usage))
}

document.getElementById("upgrade").style.display="block"

}

reader.readAsDataURL(file)

}

/* =========================
FEEDBACK
========================= */

function sendFeedback(){
document.getElementById("feedbackMessage").innerHTML =
"Thank you for your feedback!"
}

/* =========================
ON LOAD
========================= */

window.onload = () => {
  checkUserPlan()
}

</script>

</body>
</html>
